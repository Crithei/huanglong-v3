<div class="stage">
  <div class="app" id="app" data-page="home">
    <main class="pages">
      <section class="page page-home" id="p-home" aria-label="首页"></section>
      <section class="page page-tour" id="p-tour" aria-label="游览" hidden>
        <div class="map" id="map"></div>
        <div class="panel">
          <svg class="rim" viewBox="0 0 400 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 26V14C60 4 120 20 200 12S330 2 400 12V26Z"/><path class="lip" d="M0 14C60 4 120 20 200 12S330 2 400 12" vector-effect="non-scaling-stroke"/></svg>
          <div class="panel-tabs" id="panel-tabs"></div>
          <div class="panel-body" id="panel-body" role="tabpanel"></div>
        </div>
      </section>
      <section class="page page-play" id="p-play" aria-label="互动" hidden></section>
      <section class="page page-services" id="p-services" aria-label="服务" hidden></section>
    </main>

    <button class="fab" type="button" data-act="guide" aria-label="问问数字人导游">
      <span class="face"><svg class="i" aria-hidden="true"><use href="#i-guide"/></svg></span><span class="fab-text">问问导游</span>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <nav class="tabbar" aria-label="主导航">
      <button type="button" data-act="tab" data-page="home" aria-current="page"><span class="pip"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg></span>首页</button>
      <button type="button" data-act="tab" data-page="tour"><span class="pip"><svg class="i" aria-hidden="true"><use href="#i-tour"/></svg></span>游览</button>
      <button type="button" data-act="tab" data-page="play"><span class="pip"><svg class="i" aria-hidden="true"><use href="#i-pool"/></svg></span>互动</button>
      <button type="button" data-act="tab" data-page="services"><span class="pip"><svg class="i" aria-hidden="true"><use href="#i-service"/></svg></span>服务</button>
    </nav>

    <div class="layer" id="layer" hidden></div>
  </div>
</div>
